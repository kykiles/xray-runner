version: '3'

vars:
  BINARY: xray-runner
  CMD: ./cmd/xray-runner
  GIT_COMMIT:
    sh: git describe --tags --always --dirty 2>/dev/null || echo dev
  TARGET_OS: '{{default .OS (env "GOOS")}}'
  TARGET_ARCH: '{{default .ARCH (env "GOARCH")}}'
  BIN_EXT: '{{if eq .TARGET_OS "windows"}}.exe{{end}}'

tasks:
  build:
    desc: Build the binary
    cmds:
      - go build -ldflags "-X main.Version={{.GIT_COMMIT}}" -o '{{.BINARY}}{{.BIN_EXT}}' {{.CMD}}
    env:
      GOOS: '{{.TARGET_OS}}'
      GOARCH: '{{.TARGET_ARCH}}'
    generates:
      - "{{.BINARY}}*"

  build:linux:
    desc: Build the linux binary into xray_linux/
    cmds:
      - go build -ldflags "-X main.Version={{.GIT_COMMIT}}" -o 'xray_linux/{{.BINARY}}' {{.CMD}}
      - cp README.md xray_linux/README.md
    env:
      GOOS: linux
      GOARCH: '{{.TARGET_ARCH}}'
    generates:
      - "xray_linux/{{.BINARY}}"

  build:linux:onefile:
    desc: Build a single self-contained xray-runner (core + geo inside)
    cmds:
      - rm -rf internal/bundle/assets && mkdir -p internal/bundle/assets
      - gzip -c xray_linux/xray > internal/bundle/assets/xray.gz
      - gzip -c geoip.dat > internal/bundle/assets/geoip.dat.gz
      - gzip -c geosite.dat > internal/bundle/assets/geosite.dat.gz
      - go build -tags bundle -ldflags "-X main.Version={{.GIT_COMMIT}}" -o '{{.BINARY}}' {{.CMD}}
      - rm -rf internal/bundle/assets
    env:
      GOOS: linux
      GOARCH: '{{.TARGET_ARCH}}'
    sources:
      - cmd/**/*.go
      - internal/**/*.go
      - go.mod
      - xray_linux/xray
      - geoip.dat
      - geosite.dat
    generates:
      - "{{.BINARY}}"

  build:windows:dist:
    desc: Build the windows binary into xray_windows/ (ассеты рядом, не внутри)
    cmds:
      - go build -ldflags "-X main.Version={{.GIT_COMMIT}}" -o 'xray_windows/{{.BINARY}}.exe' {{.CMD}}
      - cp README.md xray_windows/README.md
    env:
      GOOS: windows
      GOARCH: '{{.TARGET_ARCH}}'
    generates:
      - "xray_windows/{{.BINARY}}.exe"

  build:windows:
    desc: Build a single self-contained xray-runner.exe (core + geo + wintun inside)
    cmds:
      - rm -rf internal/bundle/assets && mkdir -p internal/bundle/assets
      - gzip -c xray.exe > internal/bundle/assets/xray.exe.gz
      - gzip -c geoip.dat > internal/bundle/assets/geoip.dat.gz
      - gzip -c geosite.dat > internal/bundle/assets/geosite.dat.gz
      - gzip -c wintun.dll > internal/bundle/assets/wintun.dll.gz
      - go build -tags bundle -ldflags "-X main.Version={{.GIT_COMMIT}}" -o 'xray-runner.exe' {{.CMD}}
      - rm -rf internal/bundle/assets
    env:
      GOOS: windows
      GOARCH: '{{.TARGET_ARCH}}'
    sources:
      - cmd/**/*.go
      - internal/**/*.go
      - go.mod
      - xray.exe
      - geoip.dat
      - geosite.dat
      - wintun.dll
    generates:
      - xray-runner.exe

  test:
    desc: Run all tests
    cmds:
      - go test -v -coverprofile=coverage.out ./...

  test-race:
    desc: Run tests with race detector (requires CGO)
    cmds:
      - go test -v -race -coverprofile=coverage.out ./...

  test-update:
    desc: Run tests and update golden files
    cmds:
      - go test -v -update ./...

  lint:
    desc: Run golangci-lint
    cmds:
      - golangci-lint run ./...

  vet:
    desc: Run go vet
    cmds:
      - go vet ./...

  clean:
    desc: Clean build artifacts
    cmds:
      - go clean
      - cmd: remove-item xray_config.json -ErrorAction SilentlyContinue
        platforms: [windows]
      - cmd: rm -f xray_config.json
        platforms: [linux, darwin]

  run:
    desc: Build and run
    cmds:
      - task: build
      - cmd: "./{{.BINARY}}{{.BIN_EXT}}"

  default:
    desc: Run tests and build
    cmds:
      - task: test
      - task: build
